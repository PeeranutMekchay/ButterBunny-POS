<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Butter Bunny POS</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("bb-theme") === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/vendor/fonts/itim/400.css">
<link rel="stylesheet" href="/vendor/fonts/mitr/400.css">
<link rel="stylesheet" href="/vendor/fonts/mitr/500.css">
<link rel="stylesheet" href="/vendor/fonts/ibm-plex-sans-thai-looped/400.css">
<link rel="stylesheet" href="/vendor/fonts/ibm-plex-sans-thai-looped/500.css">
<link rel="stylesheet" href="/vendor/fonts/ibm-plex-sans-thai-looped/600.css">
<style>
/* Layout: soft counter POS — slim side rail (bottom bar on phones), product photo grid, ticket panel; calm low-contrast surfaces */
:root{
  --bg:#FFFAFC; --surface:#FFFFFF; --soft:#FFF0F5; --line:#F7E1EA;
  --fg:#4A2F3A; --muted:#9A7D88;
  --accent:#C8456F; --on-accent:#FFFFFF; --accent-soft:#FCE3EC; --accent-ink:#A8355C;
  --peach:#C96F55; --peach-soft:#FDEBE4;
  --rose:#C2414B; --rose-soft:#FBE3E4;
  --sky:#6A72B8; --sky-soft:#ECEDFA;
  --honey:#A97814; --honey-soft:#FFF3D6;
  --shadow:0 1px 2px rgb(150 60 90/.06),0 6px 20px rgb(150 60 90/.08);
  --ff-display:"Mitr","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --ff-body:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
  --r:18px; --r-sm:10px;
  --ff-brand:"Itim","Mitr",system-ui,sans-serif;
  --dot:rgb(232 120 160/.10); --brand-ink:#8E3B5E;
  --kraft:#FBE1EA; --kraft-edge:#EDB4C8; --kraft-ink:#6E3550; --ink:#C2416B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#241912; --surface:#33241A; --soft:#402E21; --line:#55402D;
  --fg:#FBEEDC; --muted:#CDB394;
  --accent:#F2C14E; --on-accent:#3A2510; --accent-soft:#4D3A20; --accent-ink:#FFD877;
  --peach:#EDA676; --peach-soft:#4A3122; --rose:#F08A7E; --rose-soft:#4C2C25;
  --sky:#B4C0DD; --sky-soft:#323443; --honey:#F2C14E; --honey-soft:#4A3A1E;
  --shadow:0 1px 2px rgb(0 0 0/.35),0 8px 24px rgb(0 0 0/.3); --dot:rgb(255 215 150/.05); --brand-ink:#FFD99A; --kraft:#4E3923; --kraft-edge:#73563A; --kraft-ink:#F8E6CA; --ink:#FFB27A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#241912; --surface:#33241A; --soft:#402E21; --line:#55402D;
  --fg:#FBEEDC; --muted:#CDB394;
  --accent:#F2C14E; --on-accent:#3A2510; --accent-soft:#4D3A20; --accent-ink:#FFD877;
  --peach:#EDA676; --peach-soft:#4A3122; --rose:#F08A7E; --rose-soft:#4C2C25;
  --sky:#B4C0DD; --sky-soft:#323443; --honey:#F2C14E; --honey-soft:#4A3A1E;
  --shadow:0 1px 2px rgb(0 0 0/.35),0 8px 24px rgb(0 0 0/.3); --dot:rgb(255 215 150/.05); --brand-ink:#FFD99A; --kraft:#4E3923; --kraft-edge:#73563A; --kraft-ink:#F8E6CA; --ink:#FFB27A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--ff-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:21px} h3{font-size:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}

/* Shell */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.logo{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--ff-display);font-size:20px;margin-bottom:12px}
.rail button{width:72px;border:0;background:transparent;border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:12px;position:relative}
.rail button svg{width:22px;height:22px}
.rail button:hover{background:var(--soft)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.rail .spacer{flex:1}
.theme-fab{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:20;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:var(--shadow);font:inherit;font-size:13px}
.theme-fab svg{width:18px;height:18px}
.theme-fab:hover{border-color:var(--accent)}
.rail .count{position:absolute;top:4px;right:10px;background:var(--peach);color:#fff;border-radius:999px;font-size:11px;min-width:18px;line-height:18px;padding:0 5px}
.main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main>section{max-width:1280px;margin:0 auto}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topline h2{margin-right:auto}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--peach-soft);color:var(--peach);font-weight:600;font-size:13px;flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--honey)}
.sync i.on{background:var(--accent)}

/* Controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--rose);border-color:var(--rose-soft);background:var(--surface)}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:500}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:42px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:13px;color:var(--muted)}
.form{display:grid;gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--accent-soft);color:var(--accent-ink)}
.pill.peach{background:var(--peach-soft);color:var(--peach)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.pill.honey{background:var(--honey-soft);color:var(--honey)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:32px 12px;font-size:14px}
.notice{background:var(--honey-soft);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:16px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.searchrow{display:flex;gap:10px;margin-bottom:12px}
.searchrow .input{border-radius:999px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:transform .12s,box-shadow .12s}
.prod:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.prod:disabled{cursor:not-allowed;opacity:.55;transform:none}
.ph{aspect-ratio:4/3;width:100%;background:var(--soft);display:grid;place-items:center;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font-family:var(--ff-display);font-size:34px;opacity:.85}
.t-bread{background:var(--honey-soft);color:var(--honey)} .t-cake{background:var(--rose-soft);color:var(--rose)}
.t-coffee{background:var(--peach-soft);color:var(--peach)} .t-drink{background:var(--sky-soft);color:var(--sky)}
.t-other{background:var(--accent-soft);color:var(--accent-ink)}
.prod .body{padding:10px 12px 12px;display:grid;gap:4px}
.prod .name{font-weight:500;line-height:1.35;min-height:2.7em}
.prod .meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.prod .price{font-weight:600}
.prod .promo{position:absolute;top:8px;left:8px}
.badge-qty{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--on-accent);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:600;font-size:13px;padding:0 7px;box-shadow:var(--shadow)}
.stk{font-size:12px;color:var(--muted)} .stk.low{color:var(--rose);font-weight:600}

.ticket{position:sticky;top:20px;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.t-head{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.qno{font-family:var(--ff-display);font-size:26px;line-height:1.1}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.lines{overflow:auto;padding:4px 18px;flex:1;min-height:110px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.line .n{font-weight:500;overflow-wrap:anywhere}
.line .o{font-size:12px;color:var(--muted)}
.line .disc{grid-column:1/-1;font-size:12px;color:var(--accent-ink)}
.stepper{display:flex;align-items:center;background:var(--soft);border-radius:10px}
.stepper button{border:0;background:transparent;width:32px;height:32px;cursor:pointer;font-size:18px;border-radius:10px}
.stepper span{min-width:22px;text-align:center;font-weight:500}
.totals{padding:12px 18px;display:grid;gap:6px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.row.good{color:var(--accent-ink)}
.row.big{font-family:var(--ff-display);font-size:24px}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px}
.t-foot{padding:4px 18px 18px;display:grid;grid-template-columns:auto 1fr;gap:8px}
.t-foot .primary{font-size:17px;min-height:52px}
.memberbar{margin:0 18px 8px;padding:8px 12px;border-radius:12px;background:var(--sky-soft);color:var(--sky);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cartfab{display:none}

/* Orders board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--soft);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
.ocard{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:8px;border-left:4px solid var(--line)}
.splitrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line)}
.splitrow .full{grid-column:1/-1}
.rqr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}
.rqr img{width:120px;height:120px;image-rendering:pixelated}
.rfline{display:grid;grid-template-columns:1fr auto 84px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.rcpt-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.lnrow{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.lnrow .evs{display:flex;flex-wrap:wrap;gap:4px 14px}
.ocard.preparing{border-left-color:var(--honey)} .ocard.ready{border-left-color:var(--accent)} .ocard.void{opacity:.7;border-left-color:var(--rose)}
.ocard ul{margin:0;padding-left:18px;font-size:14px}
.ocard .f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* Tables & lists */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.thumb{width:48px;height:48px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-family:var(--ff-display);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.namecell{display:flex;align-items:center;gap:12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{padding:16px;display:grid;gap:10px}
.pcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .big{font-family:var(--ff-display);font-size:22px;color:var(--accent-ink)}
.pcard .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* Reports */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .v{font-family:var(--ff-display);font-size:28px;margin-top:2px}
.kpi .s{font-size:13px;color:var(--muted)}
.panels{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{padding:18px;min-width:0;display:grid;gap:12px;align-content:start}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px;padding-top:20px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:30px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;opacity:.85}
.bar i.zero{background:var(--line)}
.bar b{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap}
.blabels{display:flex;gap:4px;margin-top:-6px}
.blabels span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:0;overflow:hidden}
.rank{display:grid;gap:12px}
.rank .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.track{grid-column:1/-1;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--peach);border-radius:4px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgb(30 22 18/.42);display:grid;place-items:center;z-index:40;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:20px;width:min(520px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:0 24px 60px rgb(0 0 0/.25)}
.modal.wide{width:min(720px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:none}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.paym{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.paym{grid-template-columns:repeat(2,1fr)}}
.paym button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 6px;cursor:pointer;font-weight:500;display:grid;justify-items:center;gap:4px}
.paym button svg{width:24px;height:24px}
.paym button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:500}
.change{background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--ff-display);font-size:22px}
.change.short{background:var(--rose-soft);color:var(--rose)}
.qrbox{display:grid;justify-items:center;gap:8px;background:#fff;color:#1d2b4f;border-radius:16px;padding:16px;border:1px solid var(--line)}
.qrbox .ppbar{background:#113566;color:#fff;font-weight:600;border-radius:8px;padding:4px 14px;font-size:14px;letter-spacing:.03em}
.qrbox canvas{width:220px;height:220px;image-rendering:pixelated;max-width:100%}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 16px;cursor:pointer}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.imgpick{display:flex;gap:14px;align-items:center}
.imgpick .ph{width:120px;border-radius:14px;flex:none}
.receipt{font-size:13px;background:#fff;color:#2a2421;border-radius:12px;padding:18px;display:grid;gap:3px;border:1px dashed #EDC9D6;width:100%;max-width:320px;margin:0 auto}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #EDC9D6;margin:6px 0;width:100%}
.receipt .row{font-size:13px}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .box{width:min(560px,100%);padding:28px;display:grid;gap:20px;text-align:center}
.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.staffgrid button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px 8px;cursor:pointer;display:grid;justify-items:center;gap:6px}
.staffgrid button:hover{border-color:var(--accent)}
.staffgrid .av{width:48px;height:48px;font-size:18px}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}

/* ===== decoration layer ===== */
body{background-image:radial-gradient(var(--dot) 1.6px,transparent 1.9px);background-size:22px 22px}
.rail{background:linear-gradient(180deg,var(--surface),var(--bg))}

.topline{padding-bottom:14px;border-bottom:1px dashed var(--line)}
.topline .ttl{margin-right:auto;min-width:0}

.card{border-radius:var(--r)}

.prod .price{font-family:var(--ff-display);font-weight:500;font-size:17px;color:var(--brand-ink)}
.ticket{overflow:visible}
.t-head{position:relative;background:var(--accent-soft);border-radius:var(--r) var(--r) 0 0;border-bottom:0;padding-bottom:16px}
.t-head::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:radial-gradient(circle at 9px 0,var(--accent-soft) 8px,transparent 8.5px) 0 0/18px 10px repeat-x}
.t-head .qno{font-family:var(--ff-brand);color:var(--brand-ink)}
.lines{padding-top:14px}
.row.big{color:var(--brand-ink)}
.col{background:var(--soft)}
.col-preparing{background:var(--honey-soft)} .col-ready{background:var(--accent-soft)}
.col-h h3{display:flex;align-items:center;gap:8px}
.col-h h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.col-preparing .col-h h3::before{background:var(--honey)} .col-ready .col-h h3::before{background:var(--accent)}
.ocard{border-left:0;box-shadow:var(--shadow);position:relative}
.ocard .qno{display:inline-grid;place-items:center;min-width:64px;height:40px;border-radius:12px;background:var(--soft);font-family:var(--ff-brand);font-size:22px!important}
.ocard.preparing .qno{background:var(--honey-soft);color:var(--honey)} .ocard.ready .qno{background:var(--accent-soft);color:var(--accent-ink)}
.tbl-wrap tbody tr:hover td{background:var(--bg)}
.thumb{width:56px;height:56px;border-radius:14px}
.pcard{position:relative;overflow:hidden;border:0;padding:18px 22px}
.pcard::before,.pcard::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.pcard::before{left:-11px} .pcard::after{right:-11px}
.pcard .big{font-family:var(--ff-brand);font-size:24px;border-top:2px dashed var(--line);padding-top:10px}
.kpi{border:0}
.kpis .kpi:nth-child(1){background:var(--accent-soft)} .kpis .kpi:nth-child(2){background:var(--honey-soft)}
.kpis .kpi:nth-child(3){background:var(--sky-soft)} .kpis .kpi:nth-child(4){background:var(--peach-soft)}
.kpi .v{color:var(--brand-ink)}
.panel h3{font-family:var(--ff-brand);font-weight:400;font-size:20px;color:var(--brand-ink)}
.modal{border-radius:24px}
.modal h2{font-family:var(--ff-brand);font-weight:400;font-size:26px;color:var(--brand-ink)}
.av.c0{background:var(--peach-soft);color:var(--peach)} .av.c1{background:var(--sky-soft);color:var(--sky)}
.av.c2{background:var(--accent-soft);color:var(--accent-ink)} .av.c3{background:var(--honey-soft);color:var(--honey)}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);place-items:stretch;padding:0;min-height:100vh;min-height:100dvh}
.brand-side{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;
  padding-block:48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;
  background:radial-gradient(circle at 12% 18%,var(--honey-soft) 0 130px,transparent 131px),radial-gradient(circle at 92% 82%,var(--surface) 0 180px,transparent 181px),radial-gradient(circle at 85% 12%,var(--sky-soft) 0 60px,transparent 61px),var(--accent-soft)}
.brand-side::after{content:"";position:absolute;inset:0;background:radial-gradient(var(--dot) 2px,transparent 2.3px) 0 0/26px 26px;pointer-events:none}

.brand-th{font-family:var(--ff-brand);font-size:clamp(26px,3.2vw,38px);color:var(--accent);line-height:1.2}
.brand-tag{color:var(--muted);margin:10px 0 0;font-size:17px}
.brand-pics{display:flex;justify-content:center;margin-top:30px;padding-left:14px}
.brand-pics img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid var(--surface);margin-left:-14px;box-shadow:var(--shadow);transform:rotate(calc((var(--i) - 3) * 5deg));animation:float 5s ease-in-out infinite;animation-delay:calc(var(--i) * -.7s)}
.login-side{display:grid;place-items:center;padding-block:32px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}

.greet{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:12px}
.greet .label{font-family:var(--ff-brand);font-size:18px;letter-spacing:0;color:var(--accent)}
.staffgrid button{border:0;background:var(--soft)}
.staffgrid button:hover{background:var(--honey-soft)}
.keypad button{border:0;background:var(--soft);font-family:var(--ff-brand);font-size:26px}

@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes float{50%{translate:0 -6px}}
@media (max-width:900px){

}
@media (prefers-reduced-motion:reduce){.brand-logo,.brand-pics img{animation:none}}

/* ===== rewards: kraft tags, rubber stamps, ticket stubs ===== */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 18px;padding:22px 4px 6px;
  background:linear-gradient(transparent calc(100% - 10px),var(--kraft-edge) calc(100% - 10px),var(--kraft-edge) calc(100% - 6px),transparent calc(100% - 6px))}
.small-shelf{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 14px;background:none;padding-top:18px}
.tag{position:relative;background:var(--kraft);color:var(--kraft-ink);border:0;border-radius:12px 12px 16px 16px;padding:26px 14px 14px;display:grid;gap:5px;text-align:left;cursor:pointer;
  box-shadow:0 3px 0 var(--kraft-edge),0 10px 18px rgb(150 60 90/.12);transform:rotate(var(--tilt,0deg));transition:transform .18s;font:inherit;align-content:start}
.tag:hover{transform:rotate(0deg) translateY(-3px)}
.tag::before{content:"";position:absolute;top:9px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgb(0 0 0/.3)}
.tag::after{content:"";position:absolute;top:-20px;left:50%;width:2px;height:31px;background:var(--kraft-edge);transform:rotate(9deg);transform-origin:bottom}
.shelf .tag:nth-child(3n+1){--tilt:-1.6deg} .shelf .tag:nth-child(3n+2){--tilt:1.1deg} .shelf .tag:nth-child(3n){--tilt:-.5deg}
.tag .picw{position:relative;margin-bottom:8px}
.tag .pic{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface);display:grid;place-items:center;max-width:100%;border:3px solid var(--surface)}
.tag .pic img{width:100%;height:100%;object-fit:cover}
.stamp{position:absolute;right:-8px;bottom:-16px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;align-content:center;line-height:1;color:var(--ink);
  border:2.5px solid var(--ink);box-shadow:inset 0 0 0 3px var(--kraft),inset 0 0 0 4.5px var(--ink);background:var(--kraft);transform:rotate(-13deg);font-family:var(--ff-brand)}
.stamp b{font-weight:400;font-size:22px} .stamp small{font-size:11px}
.tag .kind{font-size:11px;letter-spacing:.08em;opacity:.75}
.tag .nm{font-family:var(--ff-brand);font-size:19px;line-height:1.2}
.tag .bl{font-size:12px;opacity:.8}
.tag .ft{margin-top:4px;font-size:12px}
.tag .go{display:inline-block;background:var(--ink);color:var(--kraft);border-radius:999px;padding:2px 12px;font-family:var(--ff-brand);font-size:14px}
.tag .need{opacity:.8}
.tag.locked{filter:saturate(.35);opacity:.7}
.tag.locked .stamp{border-style:dashed}
.mcard{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;background:var(--surface);border:2px dashed var(--kraft-edge);border-radius:18px;padding:14px 18px}
.mc-l{display:flex;gap:12px;align-items:center} .mc-n{font-family:var(--ff-brand);font-weight:400;font-size:21px}
.mc-p{text-align:right;line-height:1.1} .mc-p b{font-family:var(--ff-brand);font-weight:400;font-size:38px;color:var(--ink);display:block} .mc-p span{font-size:12px;color:var(--muted)}
.paws{grid-column:1/-1;display:flex;gap:6px}
.paws i{flex:1;max-width:44px;height:22px;border-radius:50% 50% 45% 45%;border:2px dashed var(--kraft-edge);position:relative}
.paws i.on{background:var(--ink);border:2px solid var(--ink)}
.paws i.on::after{content:"";position:absolute;inset:5px 30%;border-radius:50%;background:var(--kraft);opacity:.5}
.mc-next{grid-column:1/-1;font-size:13px;color:var(--muted)}
.tier{display:inline-block;font-size:11px;border-radius:999px;padding:1px 9px 1px 20px;position:relative;font-weight:500;white-space:nowrap}
.tier::before,.tier::after{content:"";position:absolute;left:6px;top:3px;width:4px;height:9px;border-radius:3px;background:currentColor;opacity:.75}
.tier::after{left:11px}
.tier.baby{background:var(--sky-soft);color:var(--sky)} .tier.butter{background:var(--honey-soft);color:var(--honey)} .tier.gold{background:var(--peach-soft);color:var(--peach)}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tierbox{display:flex;gap:10px;align-items:center;border-radius:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}

.tierbox .tb-b{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}

.tierbox.rule{background:var(--kraft);color:var(--kraft-ink);border:0}
.stub{display:grid;grid-template-columns:minmax(0,1fr) 112px;background:var(--kraft);color:var(--kraft-ink);border-radius:16px;position:relative;overflow:hidden}
.stub .main{padding:18px 20px;display:grid;gap:4px}

.stub .side b{font-weight:400;font-size:30px;color:var(--ink)} .stub .side small{font-size:12px}
.stub::before,.stub::after{content:"";position:absolute;right:101px;width:22px;height:22px;border-radius:50%;background:var(--surface)}

.memberbar{flex-wrap:wrap}.memberbar .btn{white-space:nowrap}

.muted-ink{opacity:.7}
.line.rw{background:repeating-linear-gradient(-45deg,transparent 0 8px,color-mix(in srgb,var(--kraft) 45%,transparent) 8px 16px);border-radius:10px;padding-inline:8px;border-bottom-color:transparent;margin-top:4px}
.line .free{font-family:var(--ff-brand);font-weight:400;color:var(--ink);min-width:58px;text-align:right}

@media (max-width:900px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tiers{grid-template-columns:1fr}.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.small-shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.tag .nm{font-size:16px}.stamp{width:54px;height:54px}.stamp b{font-size:18px}}

/* ===== shifts, pre-orders, bake plan, dashboard ===== */
.rail{overflow-y:auto;scrollbar-width:none}

.banner .btn{margin-left:auto}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}

/* auto-confirmed QR & pre-order builder */

.paid-ok{display:grid;justify-items:center;gap:6px;padding:18px 8px;text-align:center}

const BUNNY = `<svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"> <path d="M10 9l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" fill="#F4A3BE"/> <path d="M54.5 6l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z" fill="#F2C94C"/> <circle cx="51" cy="17" r="1.3" fill="#F4A3BE"/> <circle cx="13" cy="21" r="1" fill="#F2C94C"/> <g stroke="#B98B73" stroke-width="1.6" fill="#FFFDFB"> <ellipse cx="27.2" cy="19" rx="3.7" ry="9.5" transform="rotate(-12 27.2 19)"/> <ellipse cx="36.8" cy="19" rx="3.7" ry="9.5" transform="rotate(12 36.8 19)"/> </g> <ellipse cx="27.2" cy="20" rx="1.6" ry="6.3" transform="rotate(-12 27.2 20)" fill="#F4A3BE"/> <ellipse cx="36.8" cy="20" rx="1.6" ry="6.3" transform="rotate(12 36.8 20)" fill="#F4A3BE"/> <ellipse cx="32" cy="45" rx="11" ry="9" fill="#FFFDFB" stroke="#B98B73" stroke-width="1.6"/> <circle cx="32" cy="33.5" r="9" fill="#FFFDFB" stroke="#B98B73" stroke-width="1.6"/> <circle cx="28.6" cy="33.4" r="1.3" fill="#4A2F3A"/> <circle cx="35.4" cy="33.4" r="1.3" fill="#4A2F3A"/> <ellipse cx="32" cy="35.4" rx=".95" ry=".7" fill="#E5638F"/> <path d="M30.5 36.7q1.5 1.3 3 0" fill="none" stroke="#4A2F3A" stroke-width="1.1" stroke-linecap="round"/> <circle cx="25.9" cy="36.6" r="1.9" fill="#F4A3BE" opacity=".75"/> <circle cx="38.1" cy="36.6" r="1.9" fill="#F4A3BE" opacity=".75"/> <path d="M6 34A26 26 0 0 0 58 34A27.8 27.8 0 0 1 6 34Z" fill="#F7D774" stroke="#D9A23A" stroke-width="1.5" stroke-linejoin="round"/> <path d="M10.5 41.5A22.5 22.5 0 0 0 27 56" fill="none" stroke="#FFF3BF" stroke-width="2.2" stroke-linecap="round"/> <path d="M39.5 58.6c.4 1.8.2 3.4-1 3.8-1.3.3-1.9-1.2-1.4-3.4" fill="#F7D774" stroke="#D9A23A" stroke-width="1.2" stroke-linejoin="round"/> <ellipse cx="46" cy="52.5" rx="2.6" ry="1.4" transform="rotate(-28 46 52.5)" fill="#FFE58A"/> <g fill="#FFFDFB" stroke="#B98B73" stroke-width="1.4"> <ellipse cx="26.6" cy="51.8" rx="2.8" ry="1.9"/> <ellipse cx="37.4" cy="51.8" rx="2.8" ry="1.9"/> </g> </svg>`;
const bunny = size => BUNNY.replace('width="40" height="40"', `width="${size}" height="${size}"`);
const avc = s => "c" + ([...String(s || "")].reduce((a, c) => a + c.codePointAt(0), 0) % 5);
const SUB = {dash:"ยอดขายวันนี้เทียบเมื่อวานและสัปดาห์ก่อน", pre:"เค้กวันเกิดและออเดอร์จัดเลี้ยงพร้อมมัดจำ", shift:"เปิดกะ นับเงินในลิ้นชัก และปิดกะ", bake:"บันทึกของเหลือตอนปิดร้าน และจำนวนที่ควรอบพรุ่งนี้", pos:"แตะเมนูเพื่อเพิ่มลงบิล", orders:"ติดตามคิวตั้งแต่เคาน์เตอร์ถึงมือลูกค้า", members:"ลูกค้าประจำและแต้มสะสม", menu:"เมนู รูปภาพ และสต็อกของวันนี้", promos:"โปรที่ทำให้ลูกค้ายิ้มได้", rewards:"ตู้ของรางวัลสำหรับแลกแต้มสมาชิก", report:"ภาพรวมยอดขายของร้าน", shop:"ข้อมูลร้าน พร้อมเพย์ และทีมงาน"};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round(n * 100) / 100;
const baht = (n, dec) => "฿" + Number(n || 0).toLocaleString("th-TH", {minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: 2});
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayKey = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); };
const fromKey = k => new Date(k + "T00:00:00");
const hm = t => new Date(t).toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit"});
const thDate = (t, opt={day:"numeric", month:"short", year:"numeric"}) => new Date(t).toLocaleDateString("th-TH", opt);
const q3 = n => "#" + String(n || 0).padStart(3, "0");
const initial = s => [...String(s || "?").trim()][0] || "?";
const libs = {};
const loadLib = k => libs[k] ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = LIB[k]; s.onload = res; s.onerror = () => { delete libs[k]; rej(new Error("โหลดไลบรารีไม่สำเร็จ")); }; document.head.appendChild(s); });
const isDark = () => document.documentElement.dataset.theme === "dark";
function toggleTheme(){
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("bb-theme", next); } catch {}
  render();
}
const themeBtnLabel = () => isDark() ? "โหมดสว่าง" : "โหมดมืด";
const ss = {get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} }};

/* ================= state ================= */
const S = {
  menu: [], stock: {}, promos: [], members: [], staff: [], shop: {}, today: [], rewards: [], todayRedeems: [],
  loaded: {menu:false, staff:false},
  staffMe: null, view: "pos",
  cart: [], otype: "dine", cat: "all", query: "", coupon: "", manualDisc: 0, discountOk: null, member: null, voucher: null, note: "",
  rep: {range: "today", from: dayKey(Date.now()), to: dayKey(Date.now()), orders: null, loading: false},
  ticketOpen: false, readOnlyMsg: "", online: true, pub: null, todayKey: null,
  shift: null, preorders: [], preDay: "all", dash: null, bake: null, shiftHist: null, backups: null, line: null
};
const shop = () => ({...BBPricing.DEFAULT_SHOP, ...S.shop});
const isMgr = () => S.staffMe?.role === "manager";
const itemImg = m => (m && m.img) || "";
const stockOf = id => { const s = S.stock[id]; return s && typeof s.qty === "number" ? s.qty : null; };

/* ================= server API ================= */
const api = {
  token: ss.get("bb-token") || null,
  async req(method, url, body, blob){
    const headers = {};
    if (this.token) headers.Authorization = "Bearer " + this.token;
    let payload;
    if (blob) { payload = blob; headers["Content-Type"] = blob.type || "application/octet-stream"; }
    else if (body !== undefined) { payload = JSON.stringify(body); headers["Content-Type"] = "application/json"; }
    let res;
    try { res = await fetch(url, {method, headers, body: payload}); }
    catch { if (S.online) { S.online = false; render(); } throw new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจว่าเปิดเซิร์ฟเวอร์อยู่ (npm start)"); }
    if (!S.online) { S.online = true; render(); }
    const data = (res.headers.get("content-type") || "").includes("json") ? await res.json() : null;
    if (res.status === 401 && this.token && !url.startsWith("/api/auth/")) endSession("หมดเวลาการเข้าสู่ระบบ ใส่ PIN อีกครั้ง");
    if (!res.ok) { const err = new Error(data?.error || "เกิดข้อผิดพลาด (" + res.status + ")"); err.status = res.status; throw err; }
    return data;
  },
  setToken(t){ this.token = t; ss.set("bb-token", t); store.connect(); }
};
const store = {
  downloads: true, es: null, refreshT: null,
  async init(){
    await this.loadPublic();
    if (api.token) await this.refresh();
    this.connect();
    // a new day starts a fresh queue and order board
    setInterval(() => { if (S.staffMe && S.todayKey && BBPricing.businessDay(Date.now(), shop().dayStartHour) !== S.todayKey) this.refresh(); }, 60000);
    // promo countdowns on the sale screen
    setInterval(() => { if (S.staffMe && S.view === "pos" && !$("#modalRoot").innerHTML) render(); }, 30000);
  },
  async loadPublic(){
    try {
      const p = await api.req("GET", "/api/public"); S.pub = p;
      if (!S.staffMe) { S.staff = p.staff; S.shop = p.shop; S.menu = p.menu; }
      S.readOnlyMsg = "";
    } catch (e) { S.readOnlyMsg = e.message; }
    S.loaded.staff = S.loaded.menu = true; render();
  },
  async refresh(){
    try {
      const d = await api.req("GET", "/api/bootstrap");
      Object.assign(S, {lanUrls: d.lanUrls || [], payProvider: d.payment?.provider || "none", staffMe: d.me, shop: d.shop, menu: d.menu, stock: d.stock, promos: d.promos, rewards: d.rewards, members: d.members, staff: d.staff, shift: d.shift, preorders: d.preorders,
        today: d.today.orders.slice().sort((a,b) => b.createdAt - a.createdAt), todayRedeems: d.today.redeems, todayKey: d.today.day, readOnlyMsg: ""});
      S.loaded.menu = S.loaded.staff = true;
      if (S.member) S.member = S.members.find(m => m.id === S.member.id) || null;
    } catch (e) { if (e.status !== 401) S.readOnlyMsg = e.message; }
    render();
    if (S.staffMe) viewLoad(S.view);
  },
  soon(){ clearTimeout(this.refreshT); this.refreshT = setTimeout(() => S.staffMe ? this.refresh() : this.loadPublic(), 150); },
  connect(){
    this.es?.close();
    const es = this.es = new EventSource("/api/events?token=" + encodeURIComponent(api.token || ""));
    es.onmessage = e => {
      let d = {}; try { d = JSON.parse(e.data || "{}"); } catch {}
      // the greeting after (re)connecting only needs a refresh if we were cut off and may have missed changes
      if (d.topics?.[0] === "hello") { const missed = !S.online || this.wasOffline; this.wasOffline = false; if (!S.online) { S.online = true; render(); } if (!missed) return; }
      this.soon();
    };
    es.onerror = () => { this.wasOffline = true; if (S.online) { S.online = false; render(); } };
  },
  // runs one API call; shows the server's message and returns null when it fails
  async call(method, url, body){
    try { const r = (await api.req(method, url, body)) || {ok: true}; this.soon(); return r; }
    catch (e) { toast(e.message); return null; }
  },
  async uploadImage(blob){ const r = await api.req("POST", "/api/uploads", undefined, blob); return {img: r.url}; },
  async getRange(from, to){ return api.req("GET", `/api/orders?from=${from}&to=${to}`); },
  async save(filename, data){
    try {
      const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/pdf"});
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast("ดาวน์โหลด " + filename + " แล้ว"); return true;
    } catch { toast("ดาวน์โหลดไฟล์ไม่สำเร็จ"); return false; }
  }
};
function endSession(msg){
  clearDraft();
  api.token = null; ss.set("bb-token", null);
  Object.assign(S, {staffMe: null, cart: [], member: null, voucher: null, coupon: "", manualDisc: 0, discountOk: null, note: ""});
  pinFor = null; store.loadPublic(); store.connect(); if (msg) toast(msg);
}

/* ================= auth (staff PIN) ================= */
let pinBuf = "", pinFor = null, idleT;
function lock(){ if (api.token) api.req("POST", "/api/auth/logout").catch(() => {}); endSession(); }
function bumpIdle(){ clearTimeout(idleT); if (S.staffMe) idleT = setTimeout(() => { lock(); toast("ล็อกหน้าจออัตโนมัติ เพราะไม่มีการใช้งาน 20 นาที"); }, 20 * 60000); }
["click","keydown","touchstart"].forEach(ev => document.addEventListener(ev, bumpIdle, {passive:true}));
async function tryPin(){
  const pin = pinBuf; pinBuf = ""; drawDots();
  try {
    const r = await api.req("POST", "/api/auth/login", {staffId: pinFor, pin});
    api.setToken(r.token); S.staffMe = r.staff; pinFor = null;
    S.view = r.staff.role === "manager" ? (ss.get("crumb-view") || "pos") : "pos";
    await store.refresh(); toast("สวัสดี " + r.staff.name);
  } catch (e) { const el = $("#pinErr"); if (el) el.textContent = e.message; }
}
function drawDots(){ const d = $("#dots"); if (d) d.innerHTML = [0,1,2,3].map(i => `<i class="${i < pinBuf.length ? "on" : ""}"></i>`).join(""); }

function splitName(n){ const m = String(n).match(/^([^฀-๿]+?)\s+([฀-๿].*)$/); return m ? [m[1], m[2]] : [n, ""]; }
function loginShell(inner){
  const sh = shop(), [n1, n2] = splitName(sh.name);
  const pics = S.menu.filter(m => itemImg(m) && m.active !== false).slice(0, 7);
  const h = new Date().getHours(), greet = h < 11 ? "อรุณสวัสดิ์" : h < 16 ? "สวัสดีตอนบ่าย" : "สวัสดีตอนเย็น";
  return `<button class="theme-fab" data-themetoggle aria-label="${themeBtnLabel()}">${svg(isDark() ? "sun" : "moon", 18)}${themeBtnLabel()}</button><div class="login">
    <div class="brand-side">
      <div class="brand-logo">${bunny(170)}</div>
      <h1 class="brand-name">${esc(n1)}</h1>
      ${n2 ? `<div class="brand-th">${esc(n2)}</div>` : ""}
      ${sh.tagline ? `<p class="brand-tag">${esc(sh.tagline)}</p>` : ""}
      ${pics.length ? `<div class="brand-pics">${pics.map((m, i) => `<img src="${esc(itemImg(m))}" alt="${esc(m.name)}" style="--i:${i}">`).join("")}</div>` : ""}
    </div>
    <div class="login-side"><div class="box card">
      <div class="greet"><span class="label">${greet}</span><span class="muted small">${thDate(Date.now(), {weekday:"long", day:"numeric", month:"long"})}</span></div>
      ${inner}
    </div></div>
  </div>`;
}
function renderLogin(){
  if (!S.loaded.staff) return loginShell(`<p class="muted">กำลังโหลดข้อมูลร้าน…</p>`);
  const active = S.staff.filter(s => s.active !== false);
  if (!active.length) return loginShell(`
    <div><h2>ตั้งค่าร้านครั้งแรก</h2><p class="muted" style="margin:6px 0 0">สร้างบัญชีผู้จัดการคนแรกเพื่อเข้าใช้งาน แล้วค่อยเพิ่มพนักงานคนอื่นในหน้าร้านค้า</p></div>

function crc16(s){ let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? (c << 1) ^ 0x1021 : c << 1; c &= 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, "0"); }
function promptPayPayload(id, amount){
  let t = String(id).replace(/\D/g, ""), tag;
  if (t.length === 10 && t[0] === "0") { tag = "01"; t = "0066" + t.slice(1); }
  else if (t.length === 13) tag = "02"; else if (t.length === 15) tag = "03"; else return null;
  const f = (k, v) => k + String(v.length).padStart(2, "0") + v;
  let p = f("00","01") + f("01", amount ? "12" : "11") + f("29", f("00","A000000677010111") + f(tag, t)) + f("53","764") + (amount ? f("54", amount.toFixed(2)) : "") + f("58","TH") + "6304";
  return p + crc16(p);
}
async function drawQR(canvas, text){
  await loadLib("qr");
  const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), cell = 8, m = 3, size = (n + m*2) * cell;
  canvas.width = canvas.height = size; const g = canvas.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, size, size); g.fillStyle = "#111";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c+m)*cell, (r+m)*cell, cell, cell);
}

function askApproval(amount, done){

  modal(`<div class="mh"><h2>ขออนุมัติส่วนลด</h2><button class="x" data-close aria-label="ปิด">×</button></div>

function bahtText(n){
  const D = ["", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"], P = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน"];
  const words = num => { let s = ""; const str = String(num);
    if (str.length > 6) return words(Math.floor(num / 1e6)) + "ล้าน" + (num % 1e6 ? words(num % 1e6) : "");
    for (let i = 0; i < str.length; i++) { const d = +str[i], pos = str.length - i - 1; if (!d) continue;
      if (pos === 0 && d === 1 && str.length > 1) s += "เอ็ด"; else if (pos === 1 && d === 2) s += "ยี่"; else if (!(pos === 1 && d === 1)) s += D[d];
      s += P[pos]; }
    return s; };
  const v = Math.round(Number(n) * 100), b = Math.floor(v / 100), st = v % 100;
  return (b ? words(b) + "บาท" : (st ? "" : "ศูนย์บาท")) + (st ? words(st) + "สตางค์" : "ถ้วน");
}

async function elementToPDF(html, width, filename, format){
  const cover = document.createElement("div"); cover.id = "pdfCover"; cover.textContent = "กำลังสร้าง PDF…"; document.body.appendChild(cover);
  const stage = $("#pdfStage");
  try {
    await Promise.all([loadLib("jspdf"), loadLib("h2c")]);
    stage.innerHTML = `<div style="width:${width}px;background:#fff">${html}</div>`;
    await document.fonts?.ready;
    const canvas = await window.html2canvas(stage.firstElementChild, {scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false});
    stage.innerHTML = "";
    const {jsPDF} = window.jspdf;
    let pdf;
    if (format === "a4") {
      pdf = new jsPDF({unit:"mm", format:"a4"}); const pw = 210, ph = 297, imgH = canvas.height * pw / canvas.width;
      const pagePx = Math.floor(canvas.width * ph / pw);
      for (let y = 0, i = 0; y < canvas.height; y += pagePx, i++) {
        const c = document.createElement("canvas"); c.width = canvas.width; c.height = Math.min(pagePx, canvas.height - y);
        c.getContext("2d").drawImage(canvas, 0, y, c.width, c.height, 0, 0, c.width, c.height);
        if (i) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pw, c.height * pw / c.width);
      }
    } else {
      const w = 80, h = canvas.height * w / canvas.width;
      pdf = new jsPDF({unit:"mm", format:[w, Math.max(h, 60)]}); pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, w, h);
    }
    cover.remove();
    await store.save(filename, pdf.output("arraybuffer"));
  } catch (e) { toast("สร้าง PDF ไม่สำเร็จ: " + (e.message || e)); }
  finally { cover.remove(); stage.innerHTML = ""; }
}

/* ---------- rewards ---------- */
const RKIND = {item:"เมนูฟรี", gift:"ของที่ระลึก", discount:"ส่วนลด"};
const TIERS = [["baby","ลูกกระต่าย",0],["butter","กระต่ายเนย",2000],["gold","กระต่ายทอง",8000]];
const tierOf = m => TIERS.filter(t => (m?.spent || 0) >= t[2]).pop();
const tierPill = m => { const t = tierOf(m); return `<span class="tier ${t[0]}">${t[1]}</span>`; };
const curMember = () => S.member ? (S.members.find(x => x.id === S.member.id) || S.member) : null;
const rwImg = r => r.img || (r.kind === "item" ? itemImg(S.menu.find(m => m.id === r.itemId) || {}) : "");
const rwStock = r => r.limited ? (stockOf("rw-" + r.id) ?? 0) : Infinity;
const ptsHeld = () => S.cart.filter(l => l.reward).reduce((s,l) => s + l.pts * l.qty, 0) + (S.voucher ? (S.rewards.find(r => r.id === S.voucher)?.points || 0) : 0);
function rewardBlock(r, pts, mode){
  if (r.active === false) return "ปิดอยู่";
  if (rwStock(r) <= 0) return "ของหมดแล้ว";
  if (r.kind === "item") { const m = S.menu.find(x => x.id === r.itemId); if (!m) return "ไม่พบเมนูนี้"; if (availOf(m) <= 0) return "เมนูหมด"; }
  if (mode === "direct" && r.kind === "discount") return "ใช้ได้ตอนชำระเงิน";
  if (mode === "bill" && r.kind === "discount" && S.voucher) return "ใช้ได้ 1 ใบต่อบิล";
  if (pts < r.points) return `ขาดอีก ${r.points - pts} แต้ม`;
  return "";
}
function tagHTML(r, o = {}){
  const src = rwImg(r), why = o.pts != null ? rewardBlock(r, o.pts, o.mode) : "", st = rwStock(r);
  return `<button class="tag ${why ? "locked" : ""}" ${o.attr || ""}>
    <div class="picw"><div class="pic">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : bunny(72)}</div><span class="stamp"><b>${r.points}</b><small>แต้ม</small></span></div>
    <span class="kind">${RKIND[r.kind]}${r.kind === "discount" ? " " + baht(r.value) : ""}</span>
    <span class="nm">${esc(r.name)}</span>${r.blurb ? `<span class="bl">${esc(r.blurb)}</span>` : ""}
    <span class="ft">${why ? `<span class="need">${esc(why)}</span>` : o.pts != null ? `<span class="go">แลกชิ้นนี้</span>` : `<span class="need">${r.active === false ? "เก็บไว้หลังร้าน" : st === Infinity ? "ไม่จำกัดจำนวน" : "เหลือ " + st + " ชิ้น"}</span>`}</span>
  </button>`;
}
function memberCard(m, pts){
  const act = S.rewards.filter(r => r.active !== false).sort((a,b) => a.points - b.points);
  const next = act.find(r => r.points > pts), prev = act.filter(r => r.points <= pts).pop();
  const lo = prev ? prev.points : 0, fill = next ? Math.floor((pts - lo) / Math.max(1, next.points - lo) * 10) : 10;
  return `<div class="mcard"><div class="mc-l"><span class="av ${avc(m.name)}" style="width:52px;height:52px;font-size:20px">${esc(initial(m.name))}</span>
      <div><b class="mc-n">${esc(m.name || m.id)}</b><div>${tierPill(m)}</div></div></div>
    <div class="mc-p"><b>${pts}</b><span>แต้มพร้อมใช้</span></div>
    <div class="paws" aria-hidden="true">${Array.from({length:10}, (_,i) => `<i class="${i < fill ? "on" : ""}"></i>`).join("")}</div>
    <div class="mc-next">${next ? `สะสมอีก <b>${next.points - pts}</b> แต้ม จะแลก${esc(next.name)}ได้` : act.length ? "แต้มพอแลกได้ทุกชิ้นในตู้แล้ว" : ""}</div></div>`;
}
function openRewardPicker(m, mode){
  const mm = S.members.find(x => x.id === m.id) || m;
  const pts = (mm.points || 0) - (mode === "bill" ? ptsHeld() : 0);
  const list = S.rewards.filter(r => r.active !== false).sort((a,b) => a.points - b.points);
  modal(`<div class="mh"><h2>ตู้ของรางวัล</h2><button class="x" data-close aria-label="ปิด">×</button></div>

    <p class="small muted" style="margin:0">${mode === "bill" ? "ของรางวัลจะถูกใส่ในบิลนี้ และตัดแต้มเมื่อชำระเงินเสร็จ" : "แลกทันทีโดยไม่ต้องเปิดบิล ส่วนคูปองส่วนลดใช้ได้ตอนชำระเงินเท่านั้น"}</p>`, "wide", false);

async function compressImage(file){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const W = 640, H = 480, c = document.createElement("canvas"); c.width = W; c.height = H;
  const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
  c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(img.src);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.8));
}

  const what = p.type === "percent" ? `ลด ${p.value}% ${sc}` : p.type === "amount" ? `ลด ${p.value} บาท/ชิ้น ${sc}` : p.type === "bxgy" ? `ซื้อ ${p.buy} แถม ${p.get} (${sc}) ชิ้นถูกสุดฟรี` : `ยอดครบ ${baht(p.min)} ลด ${p.unit === "percent" ? p.value + "%" : baht(p.value)}`;

/* ---------- reports ---------- */
function rangeFor(r){
  const t = new Date(); const k = dayKey(t);
  if (r === "today") return [k, k];
  if (r === "yesterday") { const y = dayKey(Date.now() - 864e5); return [y, y]; }
  if (r === "7d") return [dayKey(Date.now() - 6 * 864e5), k];
  if (r === "month") return [dayKey(new Date(t.getFullYear(), t.getMonth(), 1)), k];
  return [S.rep.from, S.rep.to];
}
async function loadReport(){
  const [a, b] = rangeFor(S.rep.range); S.rep.from = a; S.rep.to = b;
  const keys = []; for (let d = fromKey(a); dayKey(d) <= b && keys.length < 366; d.setDate(d.getDate() + 1)) keys.push(dayKey(d));
  S.rep.loading = true; S.rep.orders = null; render();
  try { const r = await store.getRange(a, keys[keys.length - 1] || a); S.rep.orders = r.orders; S.rep.pre = r.preorderPayments || []; S.rep.waste = r.waste || []; }
  catch (e) { S.rep.orders = []; S.rep.pre = []; S.rep.waste = []; toast(e.message); }
  S.rep.keys = keys; S.rep.loading = false; render();
}
function summarize(orders, keys){
  const ok = orders.filter(o => o.status !== "void"), voids = orders.filter(o => o.status === "void");
  const sum = (a, f) => r2(a.reduce((s,o) => s + (f(o) || 0), 0));
  const net = o => r2(o.total - (o.refunded || 0));
  const sales = sum(ok, net), gross = sum(ok, o => o.subtotal), disc = r2(gross - sum(ok, o => o.total)), refunds = sum(ok, o => o.refunded);
  const back = o => { const m = {}; (o.refunds || []).forEach(f => f.items.forEach(i => m[i.line] = (m[i.line] || 0) + i.qty)); return m; };
  const items = ok.reduce((s,o) => { const b = back(o); return s + o.items.reduce((a,l,i) => a + l.qty - (b[i + 1] || 0), 0); }, 0);
  const byItem = {}, byCat = {}, byPay = {cash:0, qr:0, card:0}, byPromo = {}, byStaff = {}, byType = {dine:0, take:0};
  for (const o of ok) {
    const b = back(o);
    o.items.forEach((l, i) => { const q = l.qty - (b[i + 1] || 0), k = l.name; byItem[k] ??= {q:0, v:0}; byItem[k].q += q; byItem[k].v += l.unit * q; byCat[l.cat] = (byCat[l.cat]||0) + l.unit * q; });
    for (const x of o.payments || [{pay: o.pay, amount: o.total}]) byPay[x.pay] = r2((byPay[x.pay]||0) + x.amount);
    for (const f of o.refunds || []) byPay[f.pay] = r2((byPay[f.pay]||0) - f.amount);
    (o.promos||[]).forEach(p => { byPromo[p.name] ??= {n:0, v:0}; byPromo[p.name].n++; byPromo[p.name].v += p.amt; });
    byStaff[o.staffName || "-"] ??= {n:0, v:0}; byStaff[o.staffName || "-"].n++; byStaff[o.staffName || "-"].v += net(o);
    byType[o.type === "take" ? "take" : "dine"]++;
  }
  const single = keys.length === 1;
  const buckets = single ? Array.from({length:15}, (_,i) => i + 7).map(h => ({label: String(h), v: sum(ok.filter(o => new Date(o.createdAt).getHours() === h), net)}))
    : keys.map(k => ({label: String(fromKey(k).getDate()), v: sum(ok.filter(o => o.day === k), net)}));
  return {ok, voids, sales, gross, disc, items, refunds, vat: sum(ok, o => o.vat * net(o) / (o.total || 1)), byItem, byCat, byPay, byPromo, byStaff, byType, buckets, single,
    promoTotal: sum(ok, o => o.promoTotal), manual: sum(ok, o => o.manual), points: sum(ok, o => o.pointsDisc)};
}

function reportCSV(X){
  const rows = [["เลขที่","วันที่","เวลา","คิว","สถานะ","ประเภท","รายการ","ยอดก่อนลด","ส่วนลด","ยอดสุทธิ","คืนเงิน","VAT","ชำระ","อ้างอิง","ใบกำกับภาษี","สมาชิก","พนักงาน"]];
  for (const o of [...X.ok, ...X.voids].sort((a,b) => a.createdAt - b.createdAt))
    rows.push([o.day.replace(/-/g,"") + "-" + String(o.queue).padStart(3,"0"), o.day, hm(o.createdAt), o.queue, o.status === "void" ? "ยกเลิก" : "สำเร็จ", o.type === "take" ? "กลับบ้าน" : "ทานที่ร้าน",
      o.items.map(l => l.name + (l.opt ? "(" + l.opt + ")" : "") + " x" + l.qty).join("; "), o.subtotal, r2(o.subtotal - o.total), o.total, o.refunded || 0, o.vat || 0, (o.payments || [{pay: o.pay, amount: o.total}]).map(x => PAY[x.pay] + (o.payments.length > 1 ? " " + x.amount : "")).join(" + "), o.ref || "", o.invoice?.no || "", o.memberId || "", o.staffName || ""]);
  return "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
}

// data a page loads when it opens (and again after live updates while it is open)
async function viewLoad(v){
  try {
    if (v === "dash" && isMgr()) { S.dash = await api.req("GET", "/api/dashboard"); render(); }

    if (v === "shift" && isMgr()) { S.shiftHist = (await api.req("GET", "/api/shifts")).shifts; render(); }
    if (v === "shop" && isMgr()) { const [b, l, pm, bs] = await Promise.all([api.req("GET", "/api/backups"), api.req("GET", "/api/line"), api.req("GET", "/api/payment"), api.req("GET", "/api/backup-settings")]); S.backups = b.backups; S.line = l.line; S.payment = pm.payment; S.backupCopy = bs.settings; render(); }

/* ---------- sale screen banners ---------- */
function posBanners(){
  const out = [];
  if (!S.shift) out.push(`<div class="banner warn"><b>ยังไม่ได้เปิดกะ</b><span>เปิดกะและใส่เงินทอนตั้งต้นก่อนเริ่มรับเงิน</span><button class="btn sm primary" data-nav="shift">ไปเปิดกะ</button></div>`);
  const now = new Date(), mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; }, cur = now.getHours() * 60 + now.getMinutes();
  for (const p of S.promos.filter(p => p.active !== false && !p.code && p.start && p.end)) {
    const live = promoLive(p, now), soon = !live && promoLive({...p, start: null, end: null}, now) && mins(p.start) > cur && mins(p.start) - cur <= 60;
    if (live) { const left = mins(p.end) - cur; out.push(`<div class="banner promo"><span class="pulse"></span><b>${esc(p.name)}</b><span>กำลังลดอยู่ เหลืออีก ${left >= 60 ? Math.floor(left / 60) + " ชม. " : ""}${left % 60} นาที (ถึง ${p.end} น.)</span></div>`); }
    else if (soon) out.push(`<div class="banner promo"><b>${esc(p.name)}</b><span>จะเริ่มในอีก ${mins(p.start) - cur} นาที (${p.start} น.)</span></div>`);
  }
  const dueTomorrow = S.preorders.filter(p => p.pickupDay === addDays(S.todayKey, 1) && ["pending","ready"].includes(p.status)).length;
  const dueToday = S.preorders.filter(p => p.pickupDay === S.todayKey && ["pending","ready"].includes(p.status)).length;
  if (dueToday || dueTomorrow) out.push(`<div class="banner warn"><b>ออเดอร์ล่วงหน้า</b><span>${dueToday ? `วันนี้ต้องส่ง ${dueToday} รายการ` : ""}${dueToday && dueTomorrow ? " · " : ""}${dueTomorrow ? `พรุ่งนี้ ${dueTomorrow} รายการ` : ""}</span><button class="btn sm" data-nav="pre">ดูรายการ</button></div>`);
  return out.join("");
}

      if (!manualTotal) $("#pf-total").value = r2(unit * qty);
      $("#pf-calc").innerHTML = `${esc(title)} · ${how}${qty > 1 ? ` × ${qty} ชิ้น` : ""} = <b>${baht(unit * qty)}</b>${manualTotal ? ` · <button type="button" class="linkbtn" id="pf-recalc">ใช้ราคาคำนวณ</button>` : ""}`;
      $("#pf-recalc") && ($("#pf-recalc").onclick = () => { manualTotal = false; calc(); });
    }

  $("#pf-qty").oninput = calc;
  $("#pf-total").oninput = () => { manualTotal = true; calc(); };
  paint();
}

  if (await opsClick(b, d)) return;
  if ("lock" in d) return lock();
  if (d.nav) { clearDraft(); viewLoad(d.nav); S.view = d.nav; ss.set("crumb-view", d.nav); if (d.nav === "report") S.rep.orders = null; window.scrollTo(0, 0); return render(); }
  if (d.cat) { S.cat = d.cat; return render(); }
  if (d.add) { const m = S.menu.find(x => x.id === d.add); if (!m) return; return (m.opts?.length || m.sweet) ? openOptions(m) : addToCart(m); }
  if (d.inc) { const l = S.cart.find(x => x.key === d.inc), m = S.menu.find(x => x.id === l?.id);
    if (l?.reward) { const r = S.rewards.find(x => x.id === l.reward), cm = curMember();
      if (r && cm && (cm.points || 0) - ptsHeld() >= r.points && rwStock(r) > l.qty && (!m || availOf(m) > 0)) { l.qty++; render(); } else toast("แต้มหรือของรางวัลไม่พอ"); return; }
    if (m && availOf(m) > 0) { l.qty++; render(); } else toast("สต็อกไม่พอ"); return; }
  if (d.dec) { const l = S.cart.find(x => x.key === d.dec); if (l) { l.qty--; if (l.qty <= 0) S.cart = S.cart.filter(x => x !== l); } return render(); }
  if (d.otype) { S.otype = d.otype; return render(); }
  if ("clear" in d) { S.cart = []; S.coupon = ""; S.manualDisc = 0; S.discountOk = null; S.member = null; S.voucher = null; S.note = ""; return render(); }
  if ("rewardpick" in d) { const cm = curMember(); if (cm) openRewardPicker(cm, "bill"); return; }
  if ("unvoucher" in d) { S.voucher = null; return render(); }
  if (d.memredeem) { const m = S.members.find(x => x.id === d.memredeem); if (m) openRewardPicker(m, "direct"); return; }
  if (d.rwedit !== undefined) return openReward(d.rwedit || null);
  if (d.rdcancel) { const x = S.todayRedeems.find(y => y.id === d.rdcancel); if (x && !x.voided) openCancelRedeem(x); else toast("ไม่พบรายการแลกนี้"); return; }
  if ("openticket" in d) { S.ticketOpen = true; return render(); }
  if ("closeticket" in d) { S.ticketOpen = false; return render(); }
  if ("pay" in d) return openPay();
  if ("coupon" in d) return inputBox("คูปองส่วนลด", "โค้ดคูปอง", S.coupon, v => { S.coupon = v.trim().toUpperCase(); });
  if ("manual" in d) return inputBox("ส่วนลดพิเศษ", "ลดกี่บาท", S.manualDisc || "", setManualDisc, "number");
  if ("note" in d) return inputBox("หมายเหตุออเดอร์", "เช่น หวานน้อย ไม่ใส่น้ำแข็ง แยกถุง", S.note, v => { S.note = v; }, "textarea");
  if ("pickmember" in d) return pickMember();
  if ("unmember" in d) { S.member = null; S.voucher = null; S.cart = S.cart.filter(l => !l.reward); return render(); }
  if (d.paym) { payM = d.paym; S.qrManual = false; return openPay(); }
  if ("qrmanual" in d) { S.qrManual = true; return openPay(); }
  if ("qrretry" in d) { AQ = null; return openPay(); }
  if ("qrsim" in d) { if (AQ) await store.call("POST", `/api/payments/qr/${AQ.id}/simulate`, {}); return; }
  if (d.cash) { $("#cashIn").value = d.cash; return updateChange(); }
  if (b.id === "confirmPay") return confirmPay();
  if ("goshop" in d) { closeModal(); S.view = "shop"; return render(); }
  if (d.st) return store.call("PATCH", `/api/orders/${d.st}/status`, {status: d.to});
  if (d.rcpt) { const o = S.today.find(x => x.id === d.rcpt); if (o) showReceipt(o); return; }
  if (d.refund) { const o = findOrder(d.refund); if (o) openRefund(o); return; }
  if (d.invoice) { const o = findOrder(d.invoice); if (o) openInvoice(o); return; }
  if ("findbill" in d) return openFindBill();
  if (d.copylink) { try { await navigator.clipboard.writeText(d.copylink); toast("คัดลอกลิงก์แล้ว"); } catch { inputBox("ลิงก์", "คัดลอกจากช่องนี้", d.copylink, () => {}); } return; }
  if ("splitadd" in d) { splitParts.list.push({pay: "card", amount: ""}); splitFill(-1); return splitRedraw(); }
  if (d.spdel) { splitParts.list.splice(+d.spdel, 1); splitFill(-1); return splitRedraw(); }
  if (d.spqr) return splitQr(+d.spqr);
  if (d.void) { const o = S.today.find(x => x.id === d.void); if (o) openVoid(o); return; }
  if (d.memedit !== undefined) return openMember(d.memedit || null);
  if (d.itemedit !== undefined) return openItem(d.itemedit || null);
  if (d.restock) { const n = Math.floor(+document.getElementById("rs-" + d.restock).value || 0), m = S.menu.find(x => x.id === d.restock);
    if (n > 0 && await store.call("POST", `/api/stock/${d.restock}/add`, {qty: n})) toast(`เติม ${m?.name} +${n}`); return; }
  if (d.promoedit !== undefined) return openPromo(d.promoedit || null);
  if (d.staffedit !== undefined) return openStaff(d.staffedit || null);
  if (d.range) { S.rep.range = d.range; if (d.range !== "custom") loadReport(); else render(); return; }
  if ("repgo" in d) { S.rep.from = $("#repFrom").value || S.rep.from; S.rep.to = $("#repTo").value || S.rep.to; if (S.rep.from > S.rep.to) [S.rep.from, S.rep.to] = [S.rep.to, S.rep.from]; return loadReport(); }
  if ("reppdf" in d) { const X = summarize(S.rep.orders, S.rep.keys); return elementToPDF(reportSheet(X), 794, `sales-report-${S.rep.from}${S.rep.to !== S.rep.from ? "_" + S.rep.to : ""}.pdf`, "a4"); }
  if ("taxcsv" in d) {
    try { const list = (await api.req("GET", `/api/invoices?from=${S.rep.from}&to=${S.rep.to}`)).invoices;
      const rows = [["วันที่", "เลขที่ใบกำกับภาษี", "ชื่อผู้ซื้อ", "เลขประจำตัวผู้เสียภาษีผู้ซื้อ", "สาขา", "มูลค่าสินค้า", "ภาษีมูลค่าเพิ่ม", "รวม", "สถานะ"]];
      for (const v of list) rows.push([thDate(v.createdAt), v.no, v.buyer.name, v.buyer.taxId, v.buyer.branch, v.cancelledAt ? 0 : v.base, v.cancelledAt ? 0 : v.vat, v.cancelledAt ? 0 : v.total, v.cancelledAt ? "ยกเลิก: " + (v.cancelReason || "") : "ปกติ"]);
      if (!list.length) return toast("ช่วงนี้ยังไม่มีใบกำกับภาษีเต็มรูป");
      return store.save(`tax-invoices-${S.rep.from}_${S.rep.to}.csv`, "\ufeff" + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\r\n"));
    } catch (e) { return toast(e.message); } }
  if ("repcsv" in d) { const X = summarize(S.rep.orders, S.rep.keys); return store.save(`sales-${S.rep.from}_${S.rep.to}.csv`, reportCSV(X)); }
});
document.addEventListener("change", async e => {
  if (e.target.dataset?.sppay != null) { const x = splitParts.list[+e.target.dataset.sppay]; x.pay = e.target.value; if (splitParts.list.filter(y => y.pay === "cash").length > 1) { x.pay = "card"; toast("เงินสดรวมเป็นส่วนเดียว"); } return splitRedraw(); }
  if (e.target.id === "dp-on" || e.target.id === "dp-st") { const st = ($("#dp-st").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "") || "1").slice(0, 12); setDispCfg({on: $("#dp-on").checked, station: st}); dispLast = ""; render(); toast("บันทึกการตั้งค่าจอลูกค้าแล้ว"); return; }
  const t = e.target;
  if (t.dataset.toggleitem) { const m = S.menu.find(x => x.id === t.dataset.toggleitem); if (m) await store.call("PUT", "/api/menu/" + m.id, {...m, active: t.checked, stock: null}); }
  else if (t.dataset.togglepromo) await store.call("PATCH", `/api/promos/${t.dataset.togglepromo}/active`, {active: t.checked});
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.query = t.value; render(); }
  else if (t.id === "memQ") { memQ = t.value; render(); }
  else if (t.id === "menuQ") { menuQ = t.value; render(); }
  else if (t.id === "cashIn") updateChange();
  else if (t.dataset.spamt != null) { splitParts.list[+t.dataset.spamt].amount = t.value === "" ? "" : Number(t.value); splitFill(+t.dataset.spamt); splitUpdate(); }
  else if (t.dataset.spref != null) splitParts.list[+t.dataset.spref].ref = t.value;
  else if (t.id === "spCashIn") { splitParts.given = t.value; splitUpdate(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "setupForm") { e.preventDefault();
    const n = $("#su-name").value.trim(), p = $("#su-pin").value, p2 = $("#su-pin2").value;
    if (!/^\d{4}$/.test(p)) { $("#suErr").textContent = "PIN ต้องเป็นตัวเลข 4 หลัก"; return; }
    if (p !== p2) { $("#suErr").textContent = "PIN สองช่องไม่ตรงกัน"; return; }
    try { const r = await api.req("POST", "/api/auth/setup", {name: n, pin: p}); api.setToken(r.token); S.staffMe = r.staff; clearDraft(); await store.refresh(); }
    catch (err) { $("#suErr").textContent = err.message; }
  }
  if (e.target.id === "shopForm") { e.preventDefault(); const v = id => document.getElementById(id).value.trim();
    const pp = v("s-pp").replace(/\D/g, "");
    if (pp && !promptPayPayload(pp, 1)) { toast("หมายเลขพร้อมเพย์ต้องเป็นเบอร์มือถือ 10 หลัก หรือเลข 13/15 หลัก"); return; }
    const data = {name: v("s-name") || "ร้านของฉัน", tagline: v("s-tag"), branch: v("s-branch"), phone: v("s-phone"), address: v("s-addr"), taxId: v("s-tax"), vat: v("s-vat"), promptpay: pp, footer: v("s-foot"),
      pointsPer: Math.max(1, +v("s-pper") || 25), birthdayMultiplier: Math.min(5, Math.max(1, +v("s-bmul") || 1)), dayStartHour: +v("s-dsh") || 0, lowStockAt: Math.max(0, +v("s-low") || 0), poundPrice: Math.max(1, +v("s-lb") || 250),
      discountLimitBaht: Math.max(0, +v("s-dlb") || 0), discountLimitPct: Math.min(100, Math.max(0, +v("s-dlp") || 0)), taxBranch: v("s-tbr") || "สำนักงานใหญ่", receiptUrl: v("s-rurl")};
    if (await store.call("PUT", "/api/config/shop", data)) { clearDraft(); toast("บันทึกข้อมูลร้านแล้ว"); } }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modalRoot").innerHTML) closeModal();
  if (!S.staffMe && pinFor && /^\d$/.test(e.key) && pinBuf.length < 4) { pinBuf += e.key; drawDots(); if (pinBuf.length === 4) tryPin(); }
  if (!S.staffMe && pinFor && e.key === "Backspace") { pinBuf = pinBuf.slice(0, -1); drawDots(); }
});

render();
store.init();
})();
</script>
